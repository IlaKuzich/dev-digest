# eval-skills — content tier (@devdigest/evals, skills/**).
# Runs only the skills actually touched by this PR (via evals/scripts/ci-detect.mjs), and only if
# that skill has a written evals/skills/<name>/*.eval.ts. Content tier talks to OpenRouter
# directly — no proxy needed — so this is cheap, fast, and BLOCKING. See evals/README.md.
#
# Model: OpenRouter, default deepseek/deepseek-chat (no tool-dispatch needed on this tier, so
# DeepSeek's dispatch limitation — see eval-agents.yml — doesn't apply here). Switch the default
# without touching this file via the repo variable EVAL_SKILLS_MODEL (Settings → Actions →
# Variables); a workflow_dispatch input (Actions tab → Run workflow) overrides both.
name: eval-skills

on:
  push:
    branches: [main]
    paths:
      - '.claude/skills/**'
      - 'evals/skills/**'
      - 'evals/src/**'
      - '.github/workflows/eval-skills.yml'
  pull_request:
    paths:
      - '.claude/skills/**'
      - 'evals/skills/**'
      - 'evals/src/**'
      - '.github/workflows/eval-skills.yml'
  workflow_dispatch:
    inputs:
      model:
        description: 'EVAL_MODEL override (OpenRouter slug)'
        required: false
        type: string
      judge_model:
        description: 'EVAL_JUDGE_MODEL override (OpenRouter slug)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: eval-skills-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  EVAL_MODEL: ${{ inputs.model || vars.EVAL_SKILLS_MODEL || 'deepseek/deepseek-chat' }}
  EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_SKILLS_MODEL || 'deepseek/deepseek-chat' }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed files vs base
        id: diff
        run: |
          BASE="${{ github.event.pull_request.base.ref || 'main' }}"
          git fetch origin "$BASE" --depth=50
          {
            echo 'files<<EOF'
            git diff --name-only "origin/$BASE...HEAD"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect affected skill evals
        id: detect
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
        run: node evals/scripts/ci-detect.mjs

  skills:
    needs: changes
    if: needs.changes.outputs.skills != '[]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.changes.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run skills/${{ matrix.skill }}/${{ matrix.skill }}.eval.ts
