# eval-agents — tool tier (@devdigest/evals, agents/**).
# Runs only the subagents actually touched by this PR (via evals/scripts/ci-detect.mjs), and only
# if that agent has a written evals/agents/<name>/*.eval.ts. Needs the LiteLLM proxy (the Agent
# SDK speaks the Anthropic wire protocol only). NON-BLOCKING: openai/gpt-4o-mini is not verified
# to reliably dispatch subagents (see evals/README.md "Which cheap model — verified") — treat
# this job as indicative until a dispatch-capable model is confirmed as the default.
#
# Model: OpenRouter, default openai/gpt-4o-mini — override via workflow_dispatch inputs
# (Actions tab → Run workflow), no code change needed.
name: eval-agents

on:
  push:
    branches: [main]
    paths:
      - '.claude/agents/**'
      - 'evals/agents/**'
      - 'evals/src/**'
      - '.github/workflows/eval-agents.yml'
  pull_request:
    paths:
      - '.claude/agents/**'
      - 'evals/agents/**'
      - 'evals/src/**'
      - '.github/workflows/eval-agents.yml'
  workflow_dispatch:
    inputs:
      model:
        description: 'EVAL_MODEL override (OpenRouter slug, e.g. google/gemini-2.5-flash)'
        required: false
        type: string
      judge_model:
        description: 'EVAL_JUDGE_MODEL override (OpenRouter slug)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: eval-agents-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  EVAL_MODEL: ${{ inputs.model || 'openai/gpt-4o-mini' }}
  EVAL_JUDGE_MODEL: ${{ inputs.judge_model || 'openai/gpt-4o-mini' }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_BASE_URL: http://localhost:4000

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.detect.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed files vs base
        id: diff
        run: |
          BASE="${{ github.event.pull_request.base.ref || 'main' }}"
          git fetch origin "$BASE" --depth=50
          {
            echo 'files<<EOF'
            git diff --name-only "origin/$BASE...HEAD"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect affected agent evals
        id: detect
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
        run: node evals/scripts/ci-detect.mjs

  agents:
    needs: changes
    if: needs.changes.outputs.agents != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: evals
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.changes.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - run: pnpm vitest run agents/${{ matrix.agent }}/${{ matrix.agent }}.eval.ts
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
